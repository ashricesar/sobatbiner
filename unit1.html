  <body class="unit1-page">
    <header class="site-header">
      <div class="header-inner">
        <a

          href="index.html"
          aria-label="Sobat Biner, halaman utama"
          ><span class="brand-icon">🤖</span><span>Sobat Biner</span></a

        <div class="header-actions">
          <a class="calculator-link" href="kalkulator.html">

          <div class="mini-progress" aria-label="Progres belajar">

            <span id="nav-progress-text">0%</span>

        <div class="unit1-quiz">
          <h2 id="unit1-question">Jadi, mana jawaban ini yang tepat?</h2>
          <div
            class="unit1-options"
            role="group"
            aria-labelledby="unit1-question"
          >
            <button class="unit1-option" type="button" data-answer="wrong">
              Bilangan yang terdiri dari 2 angka, yakni 0 dan 1
            </button>
            <button class="unit1-option" type="button" data-answer="wrong">
              Bilangan yang terdiri dari 10 angka, yakni 0 sampai 9
            </button>
            <button class="unit1-option" type="button" data-answer="wrong">
              Saat sinyal listrik berada pada kondisi TINGGI
            </button>
            <button class="unit1-option" type="button" data-answer="correct">
              Saat sinyal listrik berada pada kondisi RENDAH
            </button>
          </div>
          <p
            class="unit1-feedback"
            id="unit1-feedback"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </div>
      </section>
    </main>
    <script>
